<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Indices – Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .live-label {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      letter-spacing: 0.4px;
    }

    .clock {
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px 14px;
    }

    .card {
      border-radius: 8px;
      overflow: hidden;
      min-height: 86px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* TradingView widget fills each card */
    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }

    .footer {
      padding: 6px 14px 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer span {
      color: rgba(255,255,255,0.15);
      font-size: 10px;
    }

    /* Copyright attribution (required by TradingView) */
    .tradingview-widget-copyright {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="live-badge">
      <span class="live-dot"></span>
      <span class="live-label">LIVE · NYSE / NASDAQ</span>
    </div>
    <span class="clock" id="clock"></span>
  </div>

  <div class="grid">

    <!-- S&P 500 -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "FOREXCOM:SPXUSD",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- QQQ -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "NASDAQ:QQQ",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- Dow Jones -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "FOREXCOM:DJUSD",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- VIX -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
          "symbol": "CBOE:VIX",
          "width": "100%",
          "colorTheme": "dark",
          "isTransparent": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>

  </div>

  <div class="footer">
    <span>S&P 500 · QQQ · Dow Jones · VIX</span>
    <span>Data via TradingView · Weekdays 9:30am–4pm ET</span>
  </div>

  <script>
    function updateClock() {
      const t = new Date().toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        timeZone: 'America/New_York'
      });
      document.getElementById('clock').textContent = t + ' ET';
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
