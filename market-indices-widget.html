<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Indices</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 12px 6px;
    }
    .card {
      border-radius: 8px;
      overflow: hidden;
      height: 140px;
      border: 1px solid #e8e8e8;
      background: #ffffff;
    }
    .tradingview-widget-container,
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
    .tradingview-widget-copyright { display: none; }

    /* Portfolio card */
    .port-card {
      display: flex;
      flex-direction: column;
      padding: 11px 13px 10px;
      height: 100%;
      position: relative;
    }
    .port-label {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .port-name {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port-value {
      font-size: 22px;
      font-weight: 600;
      color: #111827;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }
    .port-change {
      font-size: 12px;
      font-weight: 500;
    }
    .port-change.pos { color: #16a34a; }
    .port-change.neg { color: #dc2626; }
    .port-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .port-bar.pos { background: linear-gradient(to right, #dcfce7, #16a34a); }
    .port-bar.neg { background: linear-gradient(to right, #fee2e2, #dc2626); }
    .port-date {
      font-size: 9px;
      color: #d1d5db;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- PORTFOLIO_DATA is updated by the daily sync. Format:
       { value: 126926.81, change: -310.93, pct: -0.0106, date: "Jun 1, 2026" }
       Do not edit this line manually. -->
  <script>
    var PORTFOLIO_DATA = {"value":126926.81,"change":-310.93,"pct":-0.0106,"date":"Jun 1, 2026"};
  </script>

  <div class="grid">

    <!-- S&P 500 -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
          "symbol": "CAPITALCOM:US500",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "1D",
          "colorTheme": "light",
          "trendLineColor": "rgba(41, 98, 255, 1)",
          "underLineColor": "rgba(41, 98, 255, 0.3)",
          "underLineBottomColor": "rgba(41, 98, 255, 0)",
          "isTransparent": true,
          "autosize": false
        }
        </script>
      </div>
    </div>

    <!-- QQQ -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
          "symbol": "NASDAQ:QQQ",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "1D",
          "colorTheme": "light",
          "trendLineColor": "rgba(41, 98, 255, 1)",
          "underLineColor": "rgba(41, 98, 255, 0.3)",
          "underLineBottomColor": "rgba(41, 98, 255, 0)",
          "isTransparent": true,
          "autosize": false
        }
        </script>
      </div>
    </div>

    <!-- Dow Jones -->
    <div class="card">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
          "symbol": "CAPITALCOM:US30",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "1D",
          "colorTheme": "light",
          "trendLineColor": "rgba(41, 98, 255, 1)",
          "underLineColor": "rgba(41, 98, 255, 0.3)",
          "underLineBottomColor": "rgba(41, 98, 255, 0)",
          "isTransparent": true,
          "autosize": false
        }
        </script>
      </div>
    </div>

    <!-- My Portfolio (replaces VIX) -->
    <div class="card" id="port-card">
      <div class="port-card">
        <div class="port-label">My Portfolio</div>
        <div class="port-name" id="port-name">Total Value</div>
        <div class="port-value" id="port-value">—</div>
        <div class="port-change" id="port-change"></div>
        <div class="port-date" id="port-date"></div>
      </div>
      <div class="port-bar" id="port-bar"></div>
    </div>

  </div>

  <script>
    (function() {
      var d = window.PORTFOLIO_DATA;
      if (!d || !d.value) return;

      var pos = d.change >= 0;
      var cls = pos ? 'pos' : 'neg';
      var arrow = pos ? '▲' : '▼';
      var absChg = Math.abs(d.change).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      var absPct = Math.abs(d.pct * 100).toFixed(2);

      document.getElementById('port-value').textContent =
        '$' + d.value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

      var chgEl = document.getElementById('port-change');
      chgEl.textContent = arrow + ' $' + absChg + '  (' + (pos ? '+' : '-') + absPct + '%)';
      chgEl.className = 'port-change ' + cls;

      document.getElementById('port-date').textContent = 'As of ' + d.date + ' · updated daily';
      document.getElementById('port-bar').className = 'port-bar ' + cls;
    })();
  </script>

</body>
</html>
